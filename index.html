<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Autentiskais Adventes Bingo 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a2e1a 0%, #1a4d2e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
            position: relative;
        }

        .reset-button {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .reset-button {
                position: static;
                margin: 0 auto 20px;
                width: fit-content;
            }
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .header .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            opacity: 0.9;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .header .tagline {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            opacity: 0.7;
            font-style: italic;
        }

        .progress-section {
            max-width: 600px;
            margin: 0 auto 30px;
            animation: fadeIn 1s ease;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 5px;
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 30px;
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.5s ease;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
            min-width: 60px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            font-size: 0.9rem;
        }

        .stat-card .number {
            font-size: 1.5rem;
            font-weight: 700;
            display: block;
            color: #4ade80;
        }

        .stat-card .label {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .daily-status {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(74, 222, 128, 0.3);
        }

        .daily-status.completed {
            background: rgba(74, 222, 128, 0.15);
            border-color: #4ade80;
        }

        .daily-status .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .daily-status .text {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 0 auto 40px;
            animation: fadeInUp 1s ease;
        }

        @media (max-width: 768px) {
            .bingo-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .bingo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .bingo-card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .bingo-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
        }

        .bingo-card:hover::before {
            left: 100%;
        }

        .bingo-card:not(.completed):not(.dimmed):hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #4ade80;
            box-shadow: 0 10px 40px rgba(74, 222, 128, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        .bingo-card.completed {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.2) 0%, rgba(34, 197, 94, 0.2) 100%);
            border-color: #4ade80;
            opacity: 0.7;
        }

        .bingo-card.completed::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #4ade80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #0a2e1a;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
        }

        .bingo-card.dimmed {
            opacity: 0.5;
            filter: grayscale(0.3);
        }

        .bingo-card.dimmed:hover {
            opacity: 0.7;
            transform: translateY(-3px);
            cursor: pointer;
        }

        .card-number {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.5;
        }

        .card-emoji {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            font-weight: 600;
            line-height: 1.2;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a4d2e 0%, #0a2e1a 100%);
            padding: 40px;
            border-radius: 25px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #4ade80;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.4s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 25px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
            line-height: 1;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-title {
            font-size: 2rem;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .modal-emoji {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .modal-description {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .modal-task-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 4px solid #4ade80;
        }

        .modal-task-title {
            font-weight: 600;
            margin-bottom: 15px;
            color: #4ade80;
        }

        .modal-task-list {
            list-style: none;
            padding-left: 0;
        }

        .modal-task-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .modal-task-list li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: #4ade80;
        }

        .modal-submit {
            font-weight: 600;
            margin-bottom: 20px;
            color: #4ade80;
        }

        .share-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .share-btn {
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .share-btn.tiktok {
            background: linear-gradient(135deg, #000000 0%, #ee1d52 100%);
            color: #fff;
        }

        .share-btn.tiktok:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(238, 29, 82, 0.4);
        }

        .share-btn.instagram {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #fff;
        }

        .share-btn.instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(188, 24, 136, 0.4);
        }

        .modal-checkbox {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
        }

        .modal-checkbox label {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .modal-checkbox input[type="checkbox"] {
            width: 28px;
            height: 28px;
            cursor: pointer;
            accent-color: #4ade80;
        }

        .pause-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pause-modal.active {
            display: flex;
        }

        .pause-content {
            background: linear-gradient(135deg, #1a4d2e 0%, #0a2e1a 100%);
            padding: 40px;
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            border: 2px solid #4ade80;
            box-shadow: 0 20px 60px rgba(74, 222, 128, 0.3);
            text-align: center;
            animation: modalSlideIn 0.4s ease;
        }

        .pause-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .pause-title {
            font-size: 2rem;
            color: #4ade80;
            margin-bottom: 15px;
        }

        .pause-message {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .pause-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .pause-btn {
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pause-btn.continue {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .pause-btn.continue:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .pause-btn.pause {
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
            color: #0a2e1a;
        }

        .pause-btn.pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 222, 128, 0.4);
        }

        .badges-section {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1.4s ease;
        }

        .badges-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #4ade80;
        }

        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .badge-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .badge-card.unlocked {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.3);
        }

        .badge-card:not(.unlocked) {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .badge-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .badge-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .badge-desc {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .badge-progress {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #4ade80;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #4ade80;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #22c55e;
        }

        @media (max-width: 768px) {
            .modal-content, .pause-content {
                padding: 25px;
            }

            .share-buttons {
                grid-template-columns: 1fr;
            }

            .pause-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="reset-button" onclick="resetCalendar()">
            <span>🔄</span>
            <span>Sākt no jauna</span>
        </button>
        <h1>🎄 Autentiskais Adventes Bingo 2025 🎄</h1>
        <p class="subtitle">24 mirkļi decembrī</p>
        <p class="tagline">Izvēlies savu ceļu. Būt šeit un tagad.</p>
    </div>

    <div class="progress-section">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;">
                <span id="progressText">0/25</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span class="number" id="completedCount">0</span>
                <span class="label">Pabeigti</span>
            </div>
            <div class="stat-card">
                <span class="number" id="streakCount">0</span>
                <span class="label">🔥 Streak</span>
            </div>
        </div>
    </div>

    <div class="daily-status" id="dailyStatus">
        <div class="icon">✨</div>
        <div class="text">Izvēlies savu šodienas mirkli</div>
    </div>

    <div class="bingo-grid" id="bingoGrid"></div>

    <div class="badges-section">
        <h2 class="badges-title">🏆 BADGES</h2>
        <div class="badges-grid" id="badgesGrid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="pause-modal" id="pauseModal">
        <div class="pause-content">
            <div class="pause-icon">🎉</div>
            <h2 class="pause-title">Amazing!</h2>
            <p class="pause-message">
                Tu izpildīji savu šodienas mirkli!<br>
                Pauze līdz rītdienai vai turpini?
            </p>
            <div class="pause-buttons">
                <button class="pause-btn continue" onclick="continuePlaying()">
                    Turpināt
                </button>
                <button class="pause-btn pause" onclick="pauseUntilTomorrow()">
                    Pauze 🌙
                </button>
            </div>
        </div>
    </div>

    <script>
        const challenges = [
            {
                num: 1, emoji: "🚶‍♀️", title: "Main Character Walk",
                fullDesc: "Laiks izkāpt no gultas! Šodien tu esi filmas galvenais varonis. Ej pastaigāties, ieelpo svaigu gaisu, saņem vaibu un notici sev!",
                tasks: ["Pastaigā vismaz 20 min", "Uzliec austiņās savu favorite playlistu", "Sajūti vaibu, sajūti gaisu"],
                type: "outdoor",
                badge: "🌲 Outdoor"
            },
            {
                num: 2, emoji: "☕", title: "Hot Chocolate",
                fullDesc: "Kad dzīve ir 'meh', karstā šokolāde glābj dienu. Radi savu cozy mini pasauli - logs, krūze un miers.",
                tasks: ["Uztaisi karsto šokolādi vai kakao", "Uzņem savu Pinterest-core brīdi", "Putukrējums = prestige mode"],
                type: "indoor",
                badge: "🏠 Indoor"
            },
            {
                num: 3, emoji: "🍂", title: "Nature Haul",
                fullDesc: "Ej dabā un savāc 5 random lietas kā bērnībā - lapas, akmeņus, čiekurus, zaru, kas izskatās pēc drakona. Nemaz neizvairies no šī uzdevuma, būs fun! Pasauc draugus!",
                tasks: ["Savāc savus dārgumus", "Izliec tos estētiskā flat lay", "Uzņem no augšas kā meža mood board"],
                type: "outdoor",
                badge: "🌲 Outdoor"
            },
            {
                num: 4, emoji: "🐕", title: "Pet Content",
                fullDesc: "Dzīvnieku terapija. Glaudīt kaķi ir pavisam nomierinieši. Iziet pastaigāties ar suni, veselīgi. Atrodi veidu, kā vari šodien veltīt uzmanību kādam mīlulim -- tavs, drauga vai kaimiņa, it doesn't matter.",
                tasks: ["Pamani dzīvniekus sev apkārt (kaimiņa suns, ielas kaķis, balodis)", "Uzņem bildi, kas dod 'wholesome energy' ar kādu no dzīvniekiem!"],
                type: "outdoor",
                badge: "🌲 Outdoor"
            },
            {
                num: 5, emoji: "💬", title: "Tavu Senču Gudrība Unlocked",
                fullDesc: "Vecāku stāsti vienmēr sākas nevainīgi un beidzas ar 'tu to nedrīksti darīt'. Šodien izroc viņu Ziemassvētku noslēpumus.",
                tasks: ["Pajautā: 'Kāda bija jūsu dīvainākā Ziemassvētku dāvana?'", "Sagatavo ausis haosam"],
                type: "social",
                badge: "💬 Social"
            },
            {
                num: 6, emoji: "❄️", title: "Frozen Main Character",
                fullDesc: "Izej ārā, elpo auksto gaisu un jūties kā drāmas filmas varonis. Redzamas elpas tvaiks = cinematic perfection. Iefilmē!",
                tasks: ["Uzņem foto vai īsu video ar ziemas elpu", "Vai arī mēģini noķert sniegpārsliņu ar mēli"],
                type: "outdoor",
                badge: "🌲 Outdoor"
            },
            {
                num: 7, emoji: "🎄", title: "Elf Energy",
                fullDesc: "Ugly sweater season ir sākusies. Laiks atbrīvot haosu - draugi, ģimene un maksimāla svētku enerģija. DIENAS MOTO: \"PRIEKS TĀ IR IZVĒLE!!!\"",
                tasks: ["Uzvelc kaut ko svinīgu, trakotu vai neglītu", "Uzņem kopbildi ar draugiem/ģimeni", "Jo haotiskāk, jo labāk"],
                type: "social",
                badge: "💬 Social"
            },
            {
                num: 8, emoji: "💬", title: "Compliment Stranger",
                fullDesc: "Sociālā misija: izplati labo enerģiju AFK. Atceries, prieks, tā ir izvēle!",
                tasks: ["Pasaki komplimentu kādam svešiniekam (par mēteli, matus, enerģiju, whatever)", "Esi īsts, ne cringe", "Piefiksē kā tu jūties pēc komplimenta izteikšanas?"],
                type: "social",
                badge: "💬 Social"
            },
            {
                num: 9, emoji: "📱", title: "FaceTime Nostaļģija",
                fullDesc: "Zvans senam draugam. Nav small talk, tikai reāla saruna un smiekli kā senāk. Piezvani kādam, par kuru tu jau sen domā un neesi vēl piezvanījis!",
                tasks: ["Video zvans vismaz 10 min", "Atjauno kontaktu fr fr (tulkojums mileniāļiem: \"for real, for real\")"],
                type: "social",
                badge: "💬 Social"
            },
            {

                tasks: ["Izej ārā, ieelpo trīs reizes dziļi (ieelpā skaiti līdz 4, izelpā līdz 8)", "Izturies it kā esi 'zen', ne 'freezing to death'"],
                type: "outdoor",

            {
                num: 23, emoji: "📸", title: "Group Photo Challenge",
                fullDesc: "Chaos mode: family edition or friends edition.",
                tasks: ["Uzņem grupas foto ar draugiem vai ģimeni", "Jo mazāk 'perfekti', jo labāk, nevajag iekļauties rāmjos"],
                type: "social",
                badge: "💬 Social"
            },
            {
                num: 24, emoji: "✨", title: "Year Reflection Dump",
                fullDesc: "Beidzot, reāla refleksija, ne tikai 'new year, new me' nonsense.",
                tasks: ["Pieraksti 3 labākos mirkļus un 3 lietas, ko iemācījies", "Nav jābūt dziļam, tikai patiesam"],
                type: "social",
                badge: "💬 Social"
            }
        ];

        const badges = [
            { 
                id: 'grass', 
                icon: '🌲', 
                name: 'Touch Grass Legend', 
                desc: '10+ outdoor mirkļi',
                checkFunc: (completed) => {
                    const outdoorNums = challenges.filter(c => c.type === 'outdoor').map(c => c.num);
                    const completedOutdoor = completed.filter(n => outdoorNums.includes(n));
                    return { unlocked: completedOutdoor.length >= 10, progress: `${completedOutdoor.length}/10` };
                }
            },
            { 
                id: 'social', 
                icon: '💬', 
                name: 'Social Butterfly', 
                desc: 'Visi social mirkļi',
                checkFunc: (completed) => {
                    const socialNums = challenges.filter(c => c.type === 'social').map(c => c.num);
                    const completedSocial = completed.filter(n => socialNums.includes(n));
                    return { unlocked: completedSocial.length === socialNums.length, progress: `${completedSocial.length}/${socialNums.length}` };
                }
            },
            { 
                id: 'royalty', 
                icon: '👑', 
                name: 'Bingo Royalty', 
                desc: '24/24 pabeigti',
                checkFunc: (completed) => {
                    return { unlocked: completed.length === 24, progress: `${completed.length}/24` };
                }
            }
        ];

        let completedChallenges = JSON.parse(localStorage.getItem('adventaBingo2025') || '[]');
        let dailyData = JSON.parse(localStorage.getItem('adventaBingoDaily') || '{}');
        let isPaused = false;

        function getTodayKey() {
            const today = new Date();
            return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        }

        function getTodayCompletedCount() {
            const todayKey = getTodayKey();
            return dailyData[todayKey] || 0;
        }

        function incrementTodayCount() {
            const todayKey = getTodayKey();
            dailyData[todayKey] = (dailyData[todayKey] || 0) + 1;
            localStorage.setItem('adventaBingoDaily', JSON.stringify(dailyData));
        }

        function saveProgress() {
            localStorage.setItem('adventaBingo2025', JSON.stringify(completedChallenges));
            updateStats();
        }

        function updateStats() {
            const completed = completedChallenges.length;
            const percentage = (completed / 24) * 100;
            
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${completed}/24`;
            document.getElementById('completedCount').textContent = completed;
            
            // Calculate streak (consecutive days with at least 1 completion)
            const dates = Object.keys(dailyData).sort().reverse();
            let streak = 0;
            const today = getTodayKey();
            
            for (let i = 0; i < dates.length; i++) {
                if (dailyData[dates[i]] > 0) {
                    streak++;
                } else if (dates[i] !== today) {
                    break;
                }
            }
            
            document.getElementById('streakCount').textContent = streak;

            updateDailyStatus();
            renderBadges();
        }

        function updateDailyStatus() {
            const todayCount = getTodayCompletedCount();
            const statusEl = document.getElementById('dailyStatus');
            
            if (todayCount === 0) {
                statusEl.innerHTML = `
                    <div class="icon">✨</div>
                    <div class="text">Izvēlies savu šodienas mirkli</div>
                `;
                statusEl.classList.remove('completed');
            } else {
                statusEl.innerHTML = `
                    <div class="icon">🎉</div>
                    <div class="text">Šodienas mērķis sasniegts! (${todayCount} pabeigti)</div>
                `;
                statusEl.classList.add('completed');
            }
        }

        function renderGrid() {
            const grid = document.getElementById('bingoGrid');
            grid.innerHTML = '';

            const todayCount = getTodayCompletedCount();
            const shouldDim = isPaused || todayCount > 0;

            challenges.forEach(challenge => {
                const isCompleted = completedChallenges.includes(challenge.num);
                const card = document.createElement('div');
                
                let classList = 'bingo-card';
                if (isCompleted) {
                    classList += ' completed';
                } else if (shouldDim) {
                    classList += ' dimmed';
                }
                
                card.className = classList;
                
                // Always allow opening modal to preview
                card.onclick = () => openModal(challenge);

                card.innerHTML = `
                    <div class="card-number">${challenge.num}</div>
                    <div class="card-emoji">${challenge.emoji}</div>
                    <div class="card-title">${challenge.title}</div>
                `;

                grid.appendChild(card);
            });
        }

        function renderBadges() {
            const grid = document.getElementById('badgesGrid');
            grid.innerHTML = '';

            badges.forEach(badge => {
                const result = badge.checkFunc(completedChallenges);
                
                const card = document.createElement('div');
                card.className = `badge-card ${result.unlocked ? 'unlocked' : ''}`;
                card.innerHTML = `
                    <div class="badge-icon">${badge.icon}</div>
                    <div class="badge-name">${badge.name}</div>
                    <div class="badge-desc">${badge.desc}</div>
                    <div class="badge-progress">${result.progress}</div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(challenge) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const isCompleted = completedChallenges.includes(challenge.num);

            content.innerHTML = `
                <div class="modal-header">
                    <div>
                        <div class="modal-emoji">${challenge.emoji}</div>
                        <h2 class="modal-title">${challenge.title}</h2>
                        <p style="opacity: 0.7; margin-bottom: 10px;">Challenge #${challenge.num}</p>
                    </div>
                    <button class="modal-close" onclick="closeModal()">×</button>
                </div>
                
                <div class="modal-description">${challenge.fullDesc}</div>
                
                <div class="modal-task-box">
                    <div class="modal-task-title">Uzdevums:</div>
                    <ul class="modal-task-list">
                        ${challenge.tasks.map(task => `<li>${task}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="modal-checkbox">
                    <label>
                        <input type="checkbox" ${isCompleted ? 'checked' : ''} 
                               onchange="toggleChallenge(${challenge.num}, this.checked)">
                        <span>Pabeigts! ✓</span>
                    </label>
                    <div style="margin-top: 10px; opacity: 0.7; font-size: 0.9rem;">
                        Šis uzdevums skaitās: <strong>${challenge.badge}</strong>
                    </div>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function toggleChallenge(num, checked) {
            if (checked && !completedChallenges.includes(num)) {
                completedChallenges.push(num);
                incrementTodayCount();
                saveProgress();
                renderGrid();
                closeModal();
                
                // Show pause modal after first completion today
                if (getTodayCompletedCount() === 1) {
                    setTimeout(() => {
                        document.getElementById('pauseModal').classList.add('active');
                    }, 500);
                }
            } else if (!checked) {
                completedChallenges = completedChallenges.filter(n => n !== num);
                saveProgress();
                renderGrid();
            }
        }

        function continuePlaying() {
            document.getElementById('pauseModal').classList.remove('active');
            isPaused = false;
            renderGrid();
        }

        function pauseUntilTomorrow() {
            document.getElementById('pauseModal').classList.remove('active');
            isPaused = true;
            renderGrid();
        }

        // Close modals on outside click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        // Reset calendar function
        function resetCalendar() {
            if (confirm('Vai tu tiešām vēlies sākt kalendāru no jauna? Visi progress tiks dzēsti! 🔄')) {
                // Clear all data
                localStorage.removeItem('adventaBingo2025');
                localStorage.removeItem('adventaBingoDaily');
                localStorage.removeItem('lastCheckedDate');
                
                // Reset variables
                completedChallenges = [];
                dailyData = {};
                isPaused = false;
                
                // Refresh display
                renderGrid();
                updateStats();
                
                // Show success message
                alert('✅ Kalendārs atiestatīts! Vari sākt no jauna! 🎉');
            }
        }

        // Check if new day and reset pause state
        function checkIfNewDay() {
            const currentKey = getTodayKey();
            const savedKey = localStorage.getItem('lastCheckedDate');
            
            if (!savedKey || savedKey !== currentKey) {
                // New day detected!
                localStorage.setItem('lastCheckedDate', currentKey);
                isPaused = false; // Reset pause for new day
                
                // Optional: Show subtle notification for returning users
                if (savedKey && savedKey !== currentKey) {
                    const dailyStatus = document.getElementById('dailyStatus');
                    dailyStatus.innerHTML = `
                        <div class="icon">🌅</div>
                        <div class="text">Jauna diena, jauni mirkļi! ✨</div>
                    `;
                    dailyStatus.classList.remove('completed');
                }
            }
        }

        // Initialize on page load
        checkIfNewDay();
        renderGrid();
        updateStats();
    </script>
